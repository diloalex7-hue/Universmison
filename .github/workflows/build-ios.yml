name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  build-ios:
    runs-on: macos-14  # Apple Silicon Mac (M1)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build web app
      run: npm run build
      env:
        VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

    - name: Sync Capacitor iOS
      run: npx cap sync ios

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install CocoaPods dependencies
      run: |
        cd ios/App
        pod install || echo "Using SPM instead of CocoaPods"

    - name: Build iOS (Debug - No Signing)
      run: |
        cd ios/App
        xcodebuild build \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | tail -50

    - name: Verify build output
      run: |
        echo "✅ iOS build completed successfully!"
        echo ""
        echo "📱 Build output:"
        find ios/App/build -name "*.app" -type d | head -5
        echo ""
        echo "📦 App size:"
        du -sh ios/App/build/Build/Products/Debug-iphonesimulator/App.app || true

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-build
        path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
        retention-days: 7
        if-no-files-found: warn
