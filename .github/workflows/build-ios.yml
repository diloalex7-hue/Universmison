name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build web app
      run: npm run build
      env:
        VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'bzeakmegkwzaoecmouid' }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6ZWFrbWVna3d6YW9lY21vdWlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjYzMDQsImV4cCI6MjA5MzMwMjMwNH0.Q7-KQ5Gitl181G64mJ-xtlwU01zmJoaCRjqsbaFnyuM' }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bzeakmegkwzaoecmouid.supabase.co' }}

    - name: Sync Capacitor iOS
      run: npx cap sync ios

    - name: Build iOS App with Xcode
      run: |
        cd ios/App
        xcodebuild clean build \
          -project App.xcodeproj \
          -scheme App \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Debug \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO

    - name: Verify build output
      run: |
        echo "=========================================="
        echo "🎉 iOS BUILD COMPLETED SUCCESSFULLY!"
        echo "=========================================="
        find ios/App/build -name "*.app" -type d
        echo ""
        echo "📦 App bundle size:"
        du -sh ios/App/build/Build/Products/Debug-iphonesimulator/App.app || true

    - name: Upload iOS App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UniversMaison-iOS-Simulator
        path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
        retention-days: 7
        if-no-files-found: warn
